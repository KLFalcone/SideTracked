# Netlify settings for the SideTracked frontend.
# In Netlify, set "Base directory" to: frontend

[build]
  command = "npm run build"
  publish = "dist/frontend/browser"

# Pass API and Google sign-in calls through to the backend on
# Render. To the browser everything is one website, so sign-in
# cookies just work. Change the address if Render gives a
# different one.
[[redirects]]
  from = "/api/*"
  to = "https://sidetracked-api.onrender.com/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/oauth2/*"
  to = "https://sidetracked-api.onrender.com/oauth2/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/login/oauth2/*"
  to = "https://sidetracked-api.onrender.com/login/oauth2/:splat"
  status = 200
  force = true

# Every other address loads the app itself.
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
