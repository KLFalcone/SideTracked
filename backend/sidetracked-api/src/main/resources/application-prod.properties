# Settings for the online server. Switched on with the
# environment variable SPRING_PROFILES_ACTIVE=prod.
# Everything secret (database password, Google keys) comes from
# environment variables set on the host, never from this file.

# Don't print every SQL statement into the server logs.
spring.jpa.show-sql=false

# Cookies only travel over HTTPS.
server.servlet.session.cookie.secure=true

# Never let an account adopt leftover local data on the server.
sidetracked.auth.claim-local-user=false

# Don't send error details (stack traces) to browsers.
server.error.include-stacktrace=never
server.error.include-message=never
