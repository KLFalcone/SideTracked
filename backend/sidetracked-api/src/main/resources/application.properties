spring.application.name=sidetracked-api

# MySQL Database
spring.datasource.url=jdbc:mysql://localhost:3306/sidetracked
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Flyway owns the schema. Hibernate only checks that the
# entities match it and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migrations (src/main/resources/db/migration)
# A database created before Flyway is recorded as already at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1