spring.application.name=sidetracked-api

# Port: hosting services pick it with the PORT variable.
server.port=${PORT:8080}

# MySQL Database
# Local defaults; a server sets DB_URL and DB_USERNAME instead.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/sidetracked}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD}

# JPA / Hibernate
# Flyway owns the schema. Hibernate only checks that the
# entities match it and never changes the database itself.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true

# Flyway migrations (src/main/resources/db/migration)
# A database created before Flyway is recorded as already at V1.
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

# Sign-in sessions: stay signed in for 30 days. The cookie can't
# be read by page scripts and isn't sent on cross-site requests.
# Sessions are saved in the database (Spring Session, tables from
# migration V11), so restarts don't sign anyone out.
server.servlet.session.timeout=30d
server.servlet.session.cookie.max-age=30d
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=lax

# One-time: let the first account adopt the data created before
# accounts existed (see AuthService). Off unless the
# SIDETRACKED_CLAIM_LOCAL_USER environment variable is "true".
sidetracked.auth.claim-local-user=${SIDETRACKED_CLAIM_LOCAL_USER:false}

# "Sign in with Google" switches on when these environment
# variables are set (never put the real values in this file):
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_ID
#   SPRING_SECURITY_OAUTH2_CLIENT_REGISTRATION_GOOGLE_CLIENT_SECRET