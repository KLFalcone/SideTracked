# Used by Spring tests (@ActiveProfiles("test")).
#
# Tests get their own database so they can never touch real data.
# It is created on first use and built from the Flyway migrations,
# exactly like a brand-new production database would be.
# Username and password come from application.properties.
spring.datasource.url=jdbc:mysql://localhost:3306/sidetracked_test?createDatabaseIfNotExist=true

spring.jpa.show-sql=false
